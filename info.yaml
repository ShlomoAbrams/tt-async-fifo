# Tiny Tapeout project information
project:
  title:        "Asynchronous FIFO"      # Project title
  author:       "Shlomo Abrams"      # Your name
  discord:      ""      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "Asynchronous FIFO memory with 8-bit data width and depth 16, using two different clocks"      # One line description of what your project does
  language:     "Verilog" # other examples include SystemVerilog, Amaranth, VHDL, etc
  clock_hz:     0       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values: 1x1, 1x2, 2x2, 3x2, 4x2, 6x2 or 8x2

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_shlomo_fifo"

  # List your project's source files here.
  # Source files must be in ./src and you must list each source file separately, one per line.
  # Don't forget to also update `PROJECT_SOURCES` in test/Makefile.
  source_files:
    - "tt_um_fifo.v"
    - "fifo.v"
    - "fifo_mem.v"
    - "fifo_r_ptr.v"
    - "fifo_w_ptr.v"
    - "fifo_synchronizer.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "wdata[0] (Write data bit 0)"
  ui[1]: "wdata[1] (Write data bit 1)"
  ui[2]: "wdata[2] (Write data bit 2)"
  ui[3]: "wdata[3] (Write data bit 3)"
  ui[4]: "wdata[4] (Write data bit 4)"
  ui[5]: "wdata[5] (Write data bit 5)"
  ui[6]: "wdata[6] (Write data bit 6)"
  ui[7]: "wdata[7] (Write data bit 7)"

  # Outputs
  uo[0]: "rdata[0] (Read data bit 0)"
  uo[1]: "rdata[1] (Read data bit 1)"
  uo[2]: "rdata[2] (Read data bit 2)"
  uo[3]: "rdata[3] (Read data bit 3)"
  uo[4]: "rdata[4] (Read data bit 4)"
  uo[5]: "rdata[5] (Read data bit 5)"
  uo[6]: "rdata[6] (Read data bit 6)"
  uo[7]: "rdata[7] (Read data bit 7)"

  # Bidirectional pins
  uio[0]: "winc (Write increment / enable, input)"
  uio[1]: "rinc (Read increment / enable, input)"
  uio[2]: "wrst_n (Write domain reset, active-low input)"
  uio[3]: "rrst_n (Read domain reset, active-low input)"
  uio[4]: "wclk (Write domain clock, input)"
  uio[5]: "rclk (Read domain clock, input)"
  uio[6]: "wfull (FIFO full flag, output)"
  uio[7]: "rempty (FIFO empty flag, output)"

# Do not change!
yaml_version: 6
